name: Linux GCC Build
run-name: Build project modules on Linux with CMake and GCC

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]
        c_compiler: [gcc]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Slang has many submodules of its own, of which only the ones its compiler library is built from are fetched
      - name: Fetch Slang Dependencies
        run: git -C SierraEngineEditor/vendor/slang submodule update --init external/unordered_dense external/miniz external/lz4 external/cmark external/vulkan external/fast_float external/spirv-headers external/lua

      # Installed before the Vulkan SDK, as its loader is built with support for whichever windowing systems it finds
      - name: Install Windowing Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcb-xkb-dev libxcursor-dev libxrandr-dev libwayland-dev libwayland-bin libxkbcommon-dev libdecor-0-dev

      # Platform dialogs are built with Qt, and paths are opened through GIO
      - name: Install Platform Libraries
        run: sudo apt-get install -y qt6-base-dev libgl-dev libglib2.0-dev

      - name: Prepare Vulkan SDK
        uses: ./.github/actions/setup-vulkan-sdk
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure Editor Build Directory
        id: editorStrings
        shell: bash
        run: echo "buildDirectory=${{ github.workspace }}/bin/SierraEngineEditor-Linux-GCC/" >> "$GITHUB_OUTPUT"

      - name: Configure Editor CMake Project
        run: >
          cmake -B ${{ steps.editorStrings.outputs.buildDirectory }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}/SierraEngineEditor/

      - name: Build Editor CMake Project
        run: cmake --build ${{ steps.editorStrings.outputs.buildDirectory }} --config ${{ matrix.build_type }} --parallel
