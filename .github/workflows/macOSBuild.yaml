name: macOS Apple Clang Build
run-name: Build project modules on macOS with CMake and Apple Clang

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        build_type: [Release]
        c_compiler: [clang]
        include:
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Slang has many submodules of its own, of which only the ones its compiler library is built from are fetched
      - name: Fetch Slang Dependencies
        run: git -C SierraEngineEditor/vendor/slang submodule update --init external/unordered_dense external/miniz external/lz4 external/cmark external/vulkan external/fast_float external/spirv-headers external/lua

      # Without the Vulkan SDK, only the Metal backend would be built
      - name: Prepare Vulkan SDK
        uses: ./.github/actions/setup-vulkan-sdk
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure Editor Build Directory
        id: editorStrings
        shell: bash
        run: echo "buildDirectory=${{ github.workspace }}/bin/SierraEngineEditor-macOS-Clang/" >> "$GITHUB_OUTPUT"

      # Configuring downloads some dependencies (such as fastgltf's simdjson), which occasionally fails on GitHub's runners, so it is retried once
      - name: Configure Editor CMake Project
        shell: bash
        run: |
          for attempt in 1 2; do
            cmake -B "${{ steps.editorStrings.outputs.buildDirectory }}" \
              -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
              -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -S "${{ github.workspace }}/SierraEngineEditor/" && exit 0
          done
          exit 1

      # Jobs are limited to the number of cores, as --parallel on its own lets Make start every job at once, which runs the runner out of memory
      - name: Build Editor CMake Project
        run: cmake --build ${{ steps.editorStrings.outputs.buildDirectory }} --config ${{ matrix.build_type }} --parallel $(getconf _NPROCESSORS_ONLN)
